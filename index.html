<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>コメント地獄サバイバル</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:sans-serif;
}

canvas{
    position:fixed;
    inset:0;
}

#ui{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
}

#uiLeft {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 15px;
}

#life{
    color:white;
    font-size:28px;
    text-shadow:0 0 10px black;
}

#stage{
    color:white;
    font-size:22px;
    text-shadow:0 0 10px black;
}

#pauseBtn {
    padding: 8px 16px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    background: #ffaa00;
    color: black;
    box-shadow: 0 0 10px rgba(255,170,0,0.5);
    z-index: 101;
}

#timerBox{
    width:96%;
    margin:8px auto;
    height:12px;
    background:#333;
    border-radius:999px;
    overflow:hidden;
}

#timerBar{
    width:0%;
    height:100%;
    background:#00ff66;
}

#bossBarWrap{
    width:96%;
    margin:auto;
    height:12px;
    background:#300;
    border-radius:999px;
    overflow:hidden;
    display:none;
}

#bossBar{
    width:100%;
    height:100%;
    background:red;
}

#warning{

    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:0;

    box-shadow:
    inset 0 0 100px red,
    inset 0 0 200px red;

    transition:.5s;

}

#startScreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:1000;
}

#startScreen h1{
    font-size:42px;
    margin-bottom:20px;
    text-shadow:0 0 10px #5fdcff;
    text-align:center;
}

/* 設定モーダルウィンドウ（2列グリッド） */
#settingModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    color: white;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 2000;
    padding: 10px;
}

#settingContent {
    background: #111;
    border: 2px solid #5fdcff;
    border-radius: 15px;
    padding: 15px 20px;
    max-width: 95%;
    max-height: 95vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
}

#settingContent h2 {
    margin-bottom: 10px;
    font-size: 22px;
    text-shadow: 0 0 8px #5fdcff;
}

.settings-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 20px;
    width: 100%;
    margin-bottom: 10px;
}

.setting-group{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    font-size:14px;
}

.setting-group label{
    margin-bottom:3px;
    color: #ddd;
}

.setting-group select, .setting-group input{
    padding:4px 8px;
    font-size:14px;
    border-radius:5px;
    border:none;
    background:#222;
    color:white;
    width:100%;
    text-align:center;
}

#startBtn, #fullscreenBtn, #settingCloseBtn, #settingOpenStartBtn, #restartBtn{
    margin-top:10px;
    padding:10px 25px;
    font-size:16px;
    font-weight:bold;
    border-radius:30px;
    border:none;
    cursor:pointer;
    background:#5fdcff;
    color:black;
    box-shadow:0 0 15px rgba(95,225,255,0.5);
}

#fullscreenBtn, #settingOpenStartBtn{
    background:#ffcc00;
}

#settingCloseBtn {
    background: #ff5f5f;
    color: white;
    margin-top: 5px;
}

#restartBtn{
    background:#ff5f5f;
    color:white;
    box-shadow:0 0 15px rgba(255,95,95,0.5);
}

.start-btn-group {
    display: flex;
    gap: 15px;
}

/* ポーズ画面 */
#pauseScreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    color: white;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 1500;
}

#pauseScreen h1 {
    font-size: 50px;
    margin-bottom: 20px;
    text-shadow: 0 0 10px #ffaa00;
}

#resumeBtn {
    padding: 12px 35px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    background: #00ff66;
    color: black;
    box-shadow: 0 0 15px rgba(0,255,102,0.5);
}

#gameOver{

    position:fixed;
    inset:0;

    background:black;

    color:white;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:999;

}

#gameOver h1{
    font-size:50px;
    margin-bottom: 20px;
}

#clear{

    position:fixed;
    inset:0;

    background:black;

    color:white;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:999;

}

#clear h1{
    font-size:60px;
}

#stickBase{

    position:fixed;

    left:20px;
    bottom:20px;

    width:150px;
    height:150px;

    border-radius:50%;

    background:
    rgba(255,255,255,.15);

    z-index:200;

}

#stick{

    position:absolute;

    left:45px;
    top:45px;

    width:60px;
    height:60px;

    border-radius:50%;

    background:white;

}

#fireBtn{

    position:fixed;

    right:25px;
    bottom:30px;

    width:100px;
    height:100px;

    border-radius:50%;

    background:
    rgba(255,0,0,.7);

    color:white;

    display:flex;

    justify-content:center;
    align-items:center;

    font-weight:bold;

    font-size:24px;

    z-index:200;

}

.warningText{

    position:fixed;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    color:red;

    font-size:60px;

    font-weight:bold;

    z-index:500;

}

</style>
</head>

<body>

<div id="startScreen">
    <h1>コメント地獄サバイバル</h1>
    
    <div class="start-btn-group">
        <button id="fullscreenBtn">全画面表示</button>
        <button id="settingOpenStartBtn">設定</button>
    </div>
    <button id="startBtn">ゲームスタート</button>
</div>

<!-- 設定モーダルウィンドウ（2列配置） -->
<div id="settingModal">
    <div id="settingContent">
        <h2>ゲーム設定</h2>
        
        <div class="settings-grid">
            <div class="setting-group">
                <label>初期ライフ数 (1〜100)</label>
                <input type="number" id="settingInitialLife" value="3" min="1" max="100" step="1">
            </div>

            <div class="setting-group">
                <label>敵の弾幕発射間隔 (0.1〜5秒)</label>
                <input type="number" id="settingInterval" value="0.7" min="0.1" max="5.0" step="0.1">
            </div>

            <div class="setting-group">
                <label>ボスの弾幕発射間隔 (0.1〜5秒)</label>
                <input type="number" id="settingBossInterval" value="3.0" min="0.1" max="5.0" step="0.1">
            </div>

            <div class="setting-group">
                <label>無敵時間 (0〜10秒)</label>
                <input type="number" id="settingInvTime" value="1.0" min="0" max="10" step="0.5">
            </div>

            <div class="setting-group">
                <label>弾幕を撃つ回数 (0〜3+無制限)</label>
                <select id="settingCount">
                    <option value="0">0 (撃たない)</option>
                    <option value="1">1回</option>
                    <option value="2">2回</option>
                    <option value="3" selected>3回</option>
                    <option value="unlimited">無制限</option>
                </select>
            </div>

            <div class="setting-group">
                <label>初期の敵の移動スピード</label>
                <input type="number" id="settingEnemySpeed" value="1" min="0.1" max="5" step="0.1">
            </div>

            <div class="setting-group">
                <label>自分の移動スピード</label>
                <input type="number" id="settingPlayerSpeed" value="4" min="1" max="10" step="0.5">
            </div>
        </div>

        <button id="settingCloseBtn">閉じる</button>
    </div>
</div>

<!-- ポーズ画面 -->
<div id="pauseScreen">
    <h1>一時停止</h1>
    <button id="resumeBtn">再開</button>
</div>

<div id="ui">
    <div id="uiLeft">
        <div id="life">
            ❤️❤️❤️
        </div>
        <div id="stage">
            STAGE 1
        </div>
    </div>
    <button id="pauseBtn">ポーズ</button>
</div>

<div style="width:100%; position:fixed; top:70px; z-index:100;">
    <div id="timerBox">
        <div id="timerBar"></div>
    </div>
    <div id="bossBarWrap">
        <div id="bossBar"></div>
    </div>
</div>

<div id="warning"></div>

<canvas id="game"></canvas>

<div id="stickBase">
    <div id="stick"></div>
</div>

<div id="fireBtn">
FIRE
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <button id="restartBtn">リスタート</button>
</div>

<div id="clear">
    <h1>BOSS撃破！</h1>
</div>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

    canvas.width =
    innerWidth;

    canvas.height =
    innerHeight;

}

resize();

addEventListener(
"resize",
resize
);

let gameStarted = false;
let isGameOver = false;
let isPaused = false;

const player = {

    x:200,
    y:300,

    r:20,

    speed:4,

    life:3,

    inv:false

};

let gameTime = 0;

let bossMode = false;

let round = 1;

let enemySpeed = 1;

let configInitialLife = 3;
let configEnemyInterval = 42; // フレーム数 (0.7秒 * 60)
let configBossInterval = 180; // フレーム数 (3秒 * 60)
let configInvDuration = 1000; // ミリ秒 (1秒)
let configBulletCount = "3";
let configEnemySpeedVal = 1;
let configPlayerSpeedVal = 4;

const enemies = [];

const enemyBullets = [];

const playerBullets = [];

const beams = [];

const particles = [];

const bossNames = [
"感想聞いてないw",
"嘘松乙",
"上から目線やめろ"
];

const lifeUI =
document.getElementById("life");

const stageUI =
document.getElementById(
"stage"
);

const timerBar =
document.getElementById("timerBar");

const stickBase =
document.getElementById("stickBase");

const stick =
document.getElementById("stick");

    const fireBtn =
document.getElementById("fireBtn");

let moveX = 0;
let moveY = 0;

let stickActive = false;

// 設定モーダルの開閉処理
const settingModal = document.getElementById("settingModal");

function openSettings() {
    settingModal.style.display = "flex";
}

function closeSettings() {
    settingModal.style.display = "none";
    applySettings();
}

document.getElementById("settingOpenStartBtn").addEventListener("click", openSettings);
document.getElementById("settingCloseBtn").addEventListener("click", closeSettings);

// ポーズ・再開処理
const pauseScreen = document.getElementById("pauseScreen");

document.getElementById("pauseBtn").addEventListener("click", () => {
    if (!gameStarted || isGameOver || document.getElementById("clear").style.display === "flex") return;
    isPaused = true;
    pauseScreen.style.display = "flex";
});

document.getElementById("resumeBtn").addEventListener("click", () => {
    isPaused = false;
    pauseScreen.style.display = "none";
});

document.getElementById("fullscreenBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
});

function applySettings() {
    const lifeVal = parseInt(document.getElementById("settingInitialLife").value);
    configInitialLife = isNaN(lifeVal) ? 3 : Math.max(1, Math.min(100, lifeVal));
    player.life = configInitialLife;
    updateLife();

    const sec = parseFloat(document.getElementById("settingInterval").value) || 0.7;
    configEnemyInterval = Math.round(sec * 60);

    const bSec = parseFloat(document.getElementById("settingBossInterval").value) || 3.0;
    configBossInterval = Math.round(bSec * 60);

    const invSec = parseFloat(document.getElementById("settingInvTime").value);
    configInvDuration = isNaN(invSec) ? 1000 : invSec * 1000;

    configBulletCount = document.getElementById("settingCount").value;
    configEnemySpeedVal = parseFloat(document.getElementById("settingEnemySpeed").value) || 1;
    configPlayerSpeedVal = parseFloat(document.getElementById("settingPlayerSpeed").value) || 4;

    player.speed = configPlayerSpeedVal;
    enemySpeed = configEnemySpeedVal;
}

document.getElementById("startBtn").addEventListener("click", () => {
    applySettings();
    gameStarted = true;
    document.getElementById("startScreen").style.display = "none";
});

document.getElementById("restartBtn").addEventListener("click", () => {
    isGameOver = false;
    document.getElementById("gameOver").style.display = "none";
    
    // リセット処理
    player.life = configInitialLife;
    player.x = 200;
    player.y = canvas.height / 2;
    player.inv = false;
    gameTime = 0;
    bossMode = false;
    round = 1;
    enemies.length = 0;
    enemyBullets.length = 0;
    playerBullets.length = 0;
    beams.length = 0;
    particles.length = 0;
    boss = null;
    warningStarted = false;
    document.getElementById("warning").style.opacity = 0;
    document.getElementById("bossBarWrap").style.display = "none";
    updateLife();
    updateStage();
    timerBar.style.width = "0%";
});

function updateLife(){
    if (player.life > 10) {
        lifeUI.innerHTML = "❤️ × " + player.life;
    } else {
        let hearts = "";
        for (let i = 0; i < player.life; i++) {
            hearts += "❤️";
        }
        lifeUI.innerHTML = hearts;
    }
}

function updateStage(){

    stageUI.innerHTML =
    "STAGE " + round;

}

function damagePlayer(){

    if(player.inv || !gameStarted || isGameOver || isPaused) return;

    playDamageSound();

    player.life--;

    updateLife();

    player.inv = true;

    setTimeout(()=>{

        player.inv = false;

    }, configInvDuration);

    if(player.life <= 0){
        isGameOver = true;
        document
        .getElementById(
        "gameOver"
        )
        .style.display="flex";

    }

}

stickBase.addEventListener(
"touchstart",
()=>{
    stickActive = true;
}
);

addEventListener(
"touchend",
()=>{

    stickActive = false;

    moveX = 0;
    moveY = 0;

    stick.style.left="45px";
    stick.style.top="45px";

}
);

addEventListener(
"touchmove",
e=>{

    if(!stickActive || isPaused) return;

    const rect =
    stickBase.getBoundingClientRect();

    const tx =
    e.touches[0].clientX
    - rect.left;

    const ty =
    e.touches[0].clientY
    - rect.top;

    let dx = tx - 75;
    let dy = ty - 75;

    let dist =
    Math.hypot(dx,dy);

    const max = 50;

    if(dist > max){

        dx =
        dx/dist*max;

        dy =
        dy/dist*max;

    }

    moveX = dx/max;
    moveY = dy/max;

    stick.style.left =
    (45+dx)+"px";

    stick.style.top =
    (45+dy)+"px";

}
);

function updatePlayer(){

    player.x +=
    moveX * player.speed;

    player.y +=
    moveY * player.speed;

    if(player.x < player.r)
    player.x = player.r;

    if(player.y < player.r)
    player.y = player.r;

    if(
    player.x >
    canvas.width-player.r
    ){
        player.x=
        canvas.width-player.r;
    }

    if(
    player.y >
    canvas.height-player.r
    ){
        player.y=
        canvas.height-player.r;
    }

}

function drawPlayer(){

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.r,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
    "#5fdcff";

    ctx.fill();

    if(player.inv){

        ctx.strokeStyle =
        "white";

        ctx.lineWidth = 3;

        ctx.stroke();

    }

}

function drawBackground(){

    ctx.fillStyle =
    "#111";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

function updateParticles(){

    for(
        let i=
        particles.length-1;
        i>=0;
        i--
    ){

        const p =
        particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

        if(p.life<=0){

            particles.splice(
            i,1
            );

        }

    }

}

function drawParticles(){

    particles.forEach(p=>{

        ctx.globalAlpha =
        p.life/30;

        ctx.fillStyle =
        p.color;

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );

    });

    ctx.globalAlpha = 1;

}

function spawnHitEffect(x,y){

    for(let i=0;i<15;i++){

        particles.push({

            x:x,
            y:y,

            vx:
            (Math.random()-0.5)
            *6,

            vy:
            (Math.random()-0.5)
            *6,

            life:30,

            size:4,

            color:"#5fdcff"

        });

    }

}

function updateTimer(){

    if (!gameStarted || isGameOver || isPaused || bossMode || document.getElementById("clear").style.display === "flex") return;

    gameTime += 1/60;

    const p =
    Math.min(
    gameTime/30,
    1
    );

    timerBar.style.width =
    (p*100)+"%";

}

function render(){

    drawBackground();

    drawParticles();

    drawEnemies();

    drawEnemyBullets();

    drawBeams();

    drawPlayer();

}

function update(){

    if(!gameStarted || isGameOver || isPaused || document.getElementById("clear").style.display === "flex") return;

    updatePlayer();

    updateParticles();

    if (!bossMode) {
        updateEnemies();
    }

    updateEnemyBullets();

    updateBeams();

    updateTimer();

}

function loop(){

    update();

    render();

    requestAnimationFrame(
    loop
    );

}

const enemyTypes = [
    "うおw",
    "きちーw",
    "どわーw",
    "くかw"
];

function spawnEnemy(){

    if(bossMode || !gameStarted || isGameOver || isPaused) return;

    enemies.push({

        text:
        enemyTypes[
            Math.floor(
                Math.random()*4
            )
        ],

        x:
        canvas.width + 100,

        y:
        50 +
        Math.random()
        *(canvas.height-100),

        speed:
        (2 + Math.random()*4)
        * enemySpeed,

        attack:0,
        shotCount: 0

    });

}

setInterval(()=>{

    if(gameStarted && !bossMode && !isGameOver && !isPaused){

        spawnEnemy();

    }

}, 700);

    function updateEnemies(){

    for(
        let i=
        enemies.length-1;
        i>=0;
        i--
    ){

        const e =
        enemies[i];

        e.x -= e.speed;

        e.attack++;

        const d =
        Math.hypot(
            player.x-e.x,
            player.y-e.y
        );

        if(d < 35){

            damagePlayer();

            enemies.splice(i,1);

            continue;

        }

        const canShoot = () => {
            if (configBulletCount === "unlimited") return true;
            const maxCount = parseInt(configBulletCount);
            return e.shotCount < maxCount;
        };

        if(e.text==="きちーw"){

            if(e.attack > configEnemyInterval && canShoot()){

                e.attack = 0;
                e.shotCount++;

                beams.push({

                    x:e.x,
                    y:e.y,

                    w:
                    canvas.width,

                    h:12,

                    life:60

                });

            }

        }

        if(e.text==="どわーw"){

            if(e.attack > configEnemyInterval && canShoot()){

                e.attack = 0;
                e.shotCount++;

                enemyBullets.push({

                    x:e.x,
                    y:e.y,

                    vx:0,
                    vy:0,

                    homing:true,

                    r:10,

                    life:180

                });

            }

        }

        if(e.text==="くかw"){

            if(e.attack > configEnemyInterval && canShoot()){

                e.attack = 0;
                e.shotCount++;

                for(
                let a=0;
                a<8;
                a++
                ){

                    const ang =
                    Math.PI*2/8*a;

                    enemyBullets.push({

                        x:e.x,
                        y:e.y,

                        vx:
                        Math.cos(ang)*3,

                        vy:
                        Math.sin(ang)*3,

                        homing:false,

                        r:8,

                        life:180

                    });

                }

            }

        }

        if(e.x < -250){

            enemies.splice(i,1);

        }

    }

}

function updateEnemyBullets(){

    for(
        let i=
        enemyBullets.length-1;
        i>=0;
        i--
    ){

        const b =
        enemyBullets[i];

        if(b.homing){

            const dx =
            player.x-b.x;

            const dy =
            player.y-b.y;

            const len =
            Math.hypot(dx,dy);

            if(len){

                b.vx +=
                dx/len*0.05;

                b.vy +=
                dy/len*0.05;

            }

        }

        b.x += b.vx;
        b.y += b.vy;

        b.life--;

        const d =
        Math.hypot(
            player.x-b.x,
            player.y-b.y
        );

        if(
        d <
        player.r+b.r
        ){

            damagePlayer();

            enemyBullets.splice(
            i,1
            );

            continue;

        }

        if(b.life<=0){

            enemyBullets.splice(
            i,1
            );

        }

    }

}

function updateBeams(){

    for(
        let i=
        beams.length-1;
        i>=0;
        i--
    ){

        const b =
        beams[i];

        b.life--;

        if(
    !b.warning &&
    player.y > b.y-b.h/2 &&
    player.y < b.y+b.h/2 &&
    player.x > b.x
){
    damagePlayer();
}

        if(b.life<=0){

            beams.splice(i,1);

        }

    }

}

function drawEnemies(){

    ctx.font =
    "bold 28px sans-serif";

    ctx.fillStyle =
    "white";

    enemies.forEach(e=>{

        ctx.fillText(
            e.text,
            e.x,
            e.y
        );

    });

}

function drawEnemyBullets(){

    enemyBullets.forEach(b=>{

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
        "orange";

        ctx.fill();

    });

}

function drawBeams(){

    beams.forEach(b=>{

        if(b.warning){

            ctx.fillStyle =
            "rgba(255,0,0,0.15)";

        }else{

            ctx.fillStyle =
            "rgba(255,0,0,0.8)";

        }

        ctx.fillRect(
            b.x,
            b.y-b.h/2,
            b.w,
            b.h
        );

    });

}

let warningStarted = false;

let boss = null;

const bossBarWrap =
document.getElementById(
"bossBarWrap"
);

const bossBar =
document.getElementById(
"bossBar"
);

function playBeep(){

    const ac =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    const osc =
    ac.createOscillator();

    const gain =
    ac.createGain();

    osc.type = "square";
    osc.frequency.value = 220;

    osc.connect(gain);
    gain.connect(ac.destination);

    gain.gain.value = .1;

    osc.start();

    osc.stop(
        ac.currentTime+.15
    );

}

function playLaserSound(){

    const ac =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    const osc =
    ac.createOscillator();

    const gain =
    ac.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        120,
        ac.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        40,
        ac.currentTime + 1
    );

    osc.connect(gain);
    gain.connect(ac.destination);

    gain.gain.setValueAtTime(
        0.3,
        ac.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.01,
        ac.currentTime + 1
    );

    osc.start();

    osc.stop(
        ac.currentTime + 1
    );

}

function playDamageSound(){

    const ac =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    const osc =
    ac.createOscillator();

    const gain =
    ac.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        300,
        ac.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        80,
        ac.currentTime + 0.2
    );

    osc.connect(gain);
    gain.connect(ac.destination);

    gain.gain.value = 0.2;

    osc.start();

    osc.stop(
        ac.currentTime + 0.2
    );

}

function startBoss(){

    bossMode = true;

    enemies.length = 0;
    enemyBullets.length = 0;
    beams.length = 0;

    bossBarWrap.style.display =
    "block";

    boss = {

        text:
        bossNames[
            Math.floor(
            Math.random()*3
            )
        ],

        x:
        canvas.width-250,

        y:
        canvas.height/2,

        hp:30,

        maxHp:30,

        timer:0

    };

}

function updateBoss(){

    if(!boss || document.getElementById("clear").style.display === "flex") return;

    boss.timer++;

    if(boss.timer > configBossInterval){

        boss.timer = 0;

        const attack =
        Math.floor(
        Math.random()*3
        );

        if(attack===0){

        playLaserSound();

    for(
        let y=0;
        y<canvas.height;
        y+=35
    ){

        if(Math.random()<0.2)
            continue;

        const beamY = y;

        beams.push({

            x:0,
            y:beamY,

            w:canvas.width,
            h:25,

            life:120,

            warning:true

        });

        setTimeout(()=>{

    if (isPaused) return;
    playLaserSound();

    beams.push({

        x:0,
        y:beamY,
        w:canvas.width,
        h:25,
        life:40,
        warning:false

    });

},2000);

    }

}

        if(attack===1){

            for(
            let i=0;
            i<10;
            i++
            ){

                setTimeout(()=>{

                    if(!boss || document.getElementById("clear").style.display === "flex" || isPaused)
                    return;

                    enemyBullets.push({

                        x:boss.x,

                        y:boss.y,

                        vx:0,

                        vy:0,

                        homing:true,

                        r:12,

                        life:300

                    });

                },i*1000);

            }

        }

        if(attack===2){

            let dir = -1;

            const dash =
            setInterval(()=>{

                if(isPaused) return;

                if(!boss || document.getElementById("clear").style.display === "flex"){

                    clearInterval(
                    dash
                    );

                    return;

                }

                boss.x +=
                dir*20;

                if(
                boss.x <
                canvas.width-650
                ){

                    dir = 1;

                }

                if(
                boss.x >
                canvas.width-250
                ){

                    clearInterval(
                    dash
                    );

                }

                const d =
                Math.hypot(

                player.x-boss.x,

                player.y-boss.y

                );

                if(d < 100){

                    damagePlayer();

                }

            },16);

        }

    }

    bossBar.style.width =
    (
    boss.hp/
    boss.maxHp*100
    )
    +"%";

    if(boss.hp<=0){

    boss = null;

    const clear =
    document.getElementById("clear");

    clear.style.display = "flex";

    setTimeout(()=>{

        clear.style.display = "none";

        round++;

        updateStage();

        bossMode = false;

        gameTime = 0;

        enemySpeed *= 0.90;

        bossBarWrap.style.display = "none";

    },3000);

}

}

let firing = false;

fireBtn.addEventListener(
"touchstart",
()=>{
    firing = true;
}
);

fireBtn.addEventListener(
"touchend",
()=>{
    firing = false;
}
);

    fireBtn.addEventListener(
"touchend",
()=>{
    firing = false;
}
);

setInterval(()=>{

    if(
    bossMode &&
    firing &&
    gameStarted &&
    !isGameOver &&
    !isPaused &&
    document.getElementById("clear").style.display !== "flex"
    ){

        playerBullets.push({

            x:player.x,

            y:player.y,

            vx:12,

            vy:0,

            r:6

        });

    }

},500);

function updatePlayerBullets(){

    for(
        let i=
        playerBullets.length-1;
        i>=0;
        i--
    ){

        const b =
        playerBullets[i];

        b.x += b.vx;

        if(
        boss &&
        b.x >
        boss.x-150 &&
        b.x <
        boss.x+150 &&
        b.y >
        boss.y-60 &&
        b.y <
        boss.y+60
        ){

            boss.hp--;

spawnHitEffect(
    b.x,
    b.y
);

playerBullets.splice(
    i,1
);

            continue;

        }

        if(
        b.x >
        canvas.width+50
        ){

            playerBullets.splice(
            i,1
            );

        }

    }

}

function drawPlayerBullets(){

    playerBullets.forEach(b=>{

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
        "yellow";

        ctx.fill();

    });

}

function drawBoss(){

    if(!boss) return;

ctx.font =
"bold 48px sans-serif";

    ctx.fillStyle =
    "#ff6666";

    ctx.fillText(

        boss.text,

        boss.x,

        boss.y

    );

}

const oldUpdate = update;

update = function(){

    oldUpdate();

    if(!gameStarted || isGameOver || isPaused || document.getElementById("clear").style.display === "flex") return;

    if(
    gameTime>=25 &&
    !warningStarted
    ){

        warningStarted = true;

        document
        .getElementById(
        "warning"
        )
        .style.opacity=1;

        const alarm =
        setInterval(()=>{

            if(isPaused) return;
            playBeep();

            if(bossMode || isGameOver){

                clearInterval(
                alarm
                );

            }

        },500);

    }

    if(
    gameTime>=30 &&
    !bossMode
    ){

        document
        .getElementById(
        "warning"
        )
        .style.opacity=0;

        startBoss();

    }

    updatePlayerBullets();

    updateBoss();

};

const oldRender = render;

render = function(){

    oldRender();

    drawPlayerButtons();

    drawBoss();

};

// 関数名の調整用にエイリアスを定義
function drawPlayerButtons() {
    drawPlayerBullets();
}

updateLife();

updateStage();

loop();
